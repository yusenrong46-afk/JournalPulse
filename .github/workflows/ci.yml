name: release-gates

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest --cov=journalpulse --cov-report=term-missing
      - run: uv run python scripts/validate_resources.py
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify migrations against PostgreSQL
        env:
          JOURNALPULSE_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python scripts/verify_postgres_schema.py
      - name: Verify standalone journal ownership and source lifecycle
        env:
          JOURNALPULSE_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python scripts/verify_journal_schema.py
      - name: Verify signed usage policy and request replay integrity
        env:
          JOURNALPULSE_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python scripts/verify_integrity_upgrade.py
      - name: Verify guided activity ownership, receipts, timer, and report lifecycle
        env:
          JOURNALPULSE_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python scripts/verify_activity_schema.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run generate:api && git diff --exit-code -- openapi.json lib/generated-api.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  integration:
    # Browser -> FastAPI -> PostgREST -> PostgreSQL with the real migrations. The model
    # provider is a deterministic fake, so this job never makes a paid call.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOURNALPULSE_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:integration
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-traces
          path: web/test-results
          retention-days: 7
