[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journalpulse"
version = "1.0.0"
description = "A privacy-aware research beta for personalized, adaptive reflection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Thomas" }]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-setuptools>=75",
]
research = [
    "altair>=5.5,<6",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.41,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses callables (Query/Depends) in argument defaults

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["journalpulse"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
