[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journalpulse"
version = "0.4.0"
description = "JournalPulse — a wellness-oriented emotion journaling assistant with training, API, and Streamlit UI."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Thomas" }]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "httpx>=0.24",
    "anyio>=3.7",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.24",
    "anyio>=3.7",
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest-cov>=4.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses callables (Query/Depends) in argument defaults

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
