<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1ecdf" />
    <title>Connection paused - JournalPulse</title>
    <style>
      :root { color-scheme: light; font-family: "Avenir Next", "Gill Sans", sans-serif; color: #132733; background: #f1ecdf; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 15% 5%, rgba(199,138,49,.12), transparent 28rem), #f1ecdf; }
      main { width: min(620px, 100%); padding: clamp(28px, 7vw, 58px); border: 1px solid rgba(19,39,51,.2); border-top: 3px solid #a3462e; background: #fbf8ef; box-shadow: 0 24px 70px rgba(69,57,38,.1); }
      span { color: #a3462e; font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 18px 0 14px; font-family: "Iowan Old Style", Baskerville, serif; font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 500; line-height: .95; }
      p { color: #56656c; line-height: 1.65; }
      button { min-height: 48px; margin-top: 14px; padding: 0 20px; border: 1px solid #132733; background: #132733; color: #fbf8ef; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span>Connection paused</span>
      <h1>Your writing stays with you.</h1>
      <p>JournalPulse cannot reach the reflection service right now. Reconnect before sending or saving a new entry.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
