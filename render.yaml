services:
  - type: web
    name: journalpulse-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /ready
    envVars:
      - key: JOURNALPULSE_ENV
        value: preview
      - key: JOURNALPULSE_DB_PATH
        value: /var/data/journalpulse.db
      - key: JOURNALPULSE_LLM_ENABLED
        value: "false"
      - key: JOURNALPULSE_LLM_ZDR
        value: "true"
      - key: JOURNALPULSE_MEMORY_ENABLED
        value: "false"
      - key: JOURNALPULSE_ADAPTIVE_POLICY_ENABLED
        value: "false"
      - key: JOURNALPULSE_LLM_MODEL
        value: openai/gpt-5.4-mini
    disk:
      name: journalpulse-data
      mountPath: /var/data
      sizeGB: 1
